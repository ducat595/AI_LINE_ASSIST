<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>AI LINE Assistant</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f1f5f9;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:18px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:8px 0}p{color:#aab8ce}label{display:block;margin:12px 0 6px;font-weight:600;font-size:14px}.panel{background:#172236;border:1px solid #34435b;border-radius:16px;padding:16px;margin:16px 0}input,select,textarea,button{font:inherit;border-radius:10px}input,select,textarea{background:#0d1729;color:#fff;border:1px solid #485872;padding:12px;width:100%}textarea{min-height:90px;resize:vertical}button{border:0;background:#4f8ef7;color:white;padding:12px 16px;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;flex-wrap:wrap;gap:8px}.secondary{background:#34445c}.green{background:#128c54}.chat{height:290px;overflow:auto;border-radius:12px;background:#0e1829;padding:12px;white-space:pre-wrap}.bubble{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:92%;line-height:1.5}.user{background:#284875;margin-left:auto}.assistant{background:#263448;margin-right:auto}.small{font-size:12px;color:#aab8ce}.status{font-size:13px;color:#b5c8df}.warn{color:#facc75}#reply{min-height:75px}a{color:#90baff}@media(min-width:650px){.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style></head><body><main><header><h1>🎙️ AI LINE Assistant</h1><span class="small">v1.0</span></header><p>iPhoneで音声会話、Teslaではテキスト操作にも対応。個人LINEへの送信はLINEアプリで確定します。</p><section class="panel"><div class="settings"><div><label for="api">Render API URL</label><input id="api" placeholder="https://your-service.onrender.com" autocomplete="url"></div><div><label for="model">AIモデル</label><select id="model"><option value="openai">ChatGPT (OpenAI)</option><option value="grok">Grok (xAI)</option></select></div></div><div class="buttons" style="margin-top:12px"><button id="save" class="secondary">接続先を保存</button><button id="check" class="secondary">接続テスト</button><button id="speechToggle" class="secondary">🔊 読み上げ ON</button></div><p class="status" id="status" role="status">準備完了</p></section><section class="panel"><h2 style="font-size:18px">AIと会話</h2><div id="chat" class="chat" aria-live="polite"></div><label for="prompt">話しかける内容</label><textarea id="prompt" placeholder="例：田中さんに『あと30分で着きます』と送るLINEの文章を作って"></textarea><div class="buttons"><button id="mic">🎤 音声入力</button><button id="ask">AIに送信</button><button id="stop" class="secondary">音声停止</button><button id="clear" class="secondary">会話を消去</button></div><p class="small">音声入力はiPhone Safariなど対応ブラウザのみ。利用できない場合はキーボード入力を使用してください。</p></section><section class="panel"><h2 style="font-size:18px">LINE返信文</h2><label for="recipient">送信先のメモ（LINEの送信先を自動指定しません）</label><input id="recipient" placeholder="例：田中さん"><label for="reply">送信する文章</label><textarea id="reply" placeholder="AIの回答からコピー、または直接入力"></textarea><div class="buttons"><button id="useLast" class="secondary">AIの回答を反映</button><button id="copy" class="secondary">文章をコピー</button><button id="share" class="green">LINEで送信先を選ぶ</button></div><p class="small warn">送信先の選択・内容確認・送信確定はLINEアプリで行ってください。運転中は操作せず、安全な場所に停車してください。</p></section><p class="small">このアプリはLINEの受信トークを取得しません。入力した文章はAI処理のため選択したAPI事業者へ送信されます。</p></main><script>
'use strict';const $=id=>document.getElementById(id);const history=[];let lastAnswer='';let speakEnabled=true;let recognition=null;const setStatus=s=>{$('status').textContent=s};const base=()=>($('api').value||'').trim().replace(/\/+$/,'');const add=(role,text)=>{const el=document.createElement('div');el.className='bubble '+role;el.textContent=(role==='user'?'あなた：':'AI：')+text;$('chat').append(el);$('chat').scrollTop=$('chat').scrollHeight};$('api').value=localStorage.getItem('aiLineApi')||'';$('model').value=localStorage.getItem('aiLineModel')||'openai';$('save').onclick=()=>{if(!/^https:\/\//.test(base()))return setStatus('HTTPSのRender URLを入力してください');localStorage.setItem('aiLineApi',base());setStatus('接続先を保存しました')};$('model').onchange=()=>localStorage.setItem('aiLineModel',$('model').value);$('check').onclick=async()=>{try{const r=await fetch(base()+'/health');if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();setStatus('接続OK: '+JSON.stringify(data))}catch(e){setStatus('接続失敗: '+e.message)}};function speak(s){if(!speakEnabled||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=1;window.speechSynthesis.speak(u)}$('speechToggle').onclick=()=>{speakEnabled=!speakEnabled;$('speechToggle').textContent=speakEnabled?'🔊 読み上げ ON':'🔇 読み上げ OFF';if(!speakEnabled&&'speechSynthesis'in window)speechSynthesis.cancel()};$('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();recognition?.stop()};$('clear').onclick=()=>{history.length=0;lastAnswer='';$('chat').replaceChildren();setStatus('会話履歴を消去しました')};$('ask').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt)return; if(!/^https:\/\//.test(base()))return setStatus('Render API URLを入力してください');add('user',prompt);history.push({role:'user',content:prompt});$('prompt').value='';$('ask').disabled=true;setStatus('AIに問い合わせ中…');try{const r=await fetch(base()+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('model').value,messages:history.slice(-16)})});const data=await r.json();if(!r.ok)throw Error(data.detail||'HTTP '+r.status);lastAnswer=data.reply;history.push({role:'assistant',content:lastAnswer});add('assistant',lastAnswer);setStatus('回答を受信しました');speak(lastAnswer)}catch(e){history.pop();add('assistant','エラー: '+e.message);setStatus('通信エラー')}finally{$('ask').disabled=false}};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SR)return setStatus('このブラウザは音声認識に対応していません。iPhoneのキーボード音声入力も利用できます');try{recognition=new SR();recognition.lang='ja-JP';recognition.interimResults=false;recognition.onresult=e=>{$('prompt').value=e.results[0][0].transcript;setStatus('音声を文字に変換しました。確認してAIに送信してください')};recognition.onerror=e=>setStatus('音声認識エラー: '+e.error);recognition.start();setStatus('聞き取り中…')}catch(e){setStatus('マイクを開始できません: '+e.message)}};$('useLast').onclick=()=>{$('reply').value=lastAnswer;setStatus('AIの回答を返信文に反映しました。内容を確認してください')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('reply').value);setStatus('コピーしました')}catch{setStatus('コピーできませんでした。文章を長押ししてコピーしてください')}};$('share').onclick=()=>{const text=$('reply').value.trim();if(!text)return setStatus('返信文を入力してください');window.location.href='https://line.me/R/share?text='+encodeURIComponent(text)};
</script></body></html>
